<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Mini App</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Ежедневник</h1>

      <section class="card">
        <h2>Новая задача</h2>
        <form id="taskForm">
          <input id="title" type="text" placeholder="Название" required maxlength="255" />
          <textarea id="description" placeholder="Описание" maxlength="2000"></textarea>
          <input id="deadline" type="datetime-local" required />
          <button type="submit">Создать</button>
        </form>
      </section>

      <nav class="tabs">
        <button data-tab="active" class="tab active">Активные</button>
        <button data-tab="today" class="tab">Сегодня</button>
        <button data-tab="completed" class="tab">Завершённые</button>
        <button data-tab="leaderboard" class="tab">Лидерборд</button>
      </nav>

      <section id="tasksSection" class="card">
        <h2 id="sectionTitle">Активные задачи</h2>
        <div id="list"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
